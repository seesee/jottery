name: "CodeQL Config"

paths-ignore:
  - 'public/pdf.worker.min.mjs'  # Vendored third-party library (PDF.js)
  - '**/*.test.ts'               # Unit test files contain test fixtures
  - '**/*.spec.ts'               # E2E test files contain test fixtures
  - 'e2e/**'                     # E2E test directory
  - 'src/test/**'                # Test utilities
  - 'tui/tests/**'               # TUI test files

# Note: The following are intentional design choices with user warnings:
# - src/lib/services/passwordStorageService.ts: Optional "remember password" feature
#   Users are explicitly warned about cleartext localStorage storage
