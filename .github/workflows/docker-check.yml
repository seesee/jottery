name: Docker Image Check

# Builds the image and starts it, without pushing anything. The release only
# builds the image on a tag, so this is what tests a Dockerfile change beforehand.
# amd64 only: the arm builds run under emulation and take far longer.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Caddyfile'
      - 'docker-compose.yml'
      - 'scripts/docker-*'
      - '.github/workflows/docker-check.yml'
  workflow_call:  # Run by manual release rehearsals, from build-multiarch.yml
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  docker-check:
    name: Build and Start Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: jottery:check

      # /admin/ comes from the server through Caddy, so it proves both are running
      - name: Start image and check what it serves
        run: |
          docker run --detach --name jottery-check --publish 8088:8088 jottery:check
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:8088/admin/ && break
            sleep 2
          done
          curl --fail --silent --show-error --output /dev/null http://localhost:8088/admin/
          curl --fail --silent --show-error --head http://localhost:8088/ | grep --ignore-case '^content-security-policy:'

      - name: Check the services run unprivileged and are supervised
        run: |
          # /proc/1/status covers the entrypoint after it has dropped to the jottery user
          docker exec jottery-check grep -E '^Uid:[[:space:]]+10001[[:space:]]' /proc/1/status
          docker exec --user jottery jottery-check sh -c 'test ! -w /app/dist/index.html'
          # The recovery tool, which the README tells people to run this way
          docker exec --user jottery jottery-check jottery-admin stats
          # Caddy turns an oversized request away before the server sees it
          test "$(head --bytes=104857601 /dev/zero | curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --data-binary @- http://localhost:8088/api/v1/sync/push)" = 413
          # The server's own answer, not index.html from the fallback route
          test "$(curl --fail --silent --show-error http://localhost:8088/health)" = OK
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Health.Status}}' jottery-check)" = healthy && break
            sleep 3
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' jottery-check)" = healthy

          # A dead server must take the container down, not leave Caddy serving 502s
          docker exec jottery-check sh -c '
            for process in /proc/[0-9]*; do
              if [ "$(cat "$process/comm" 2>/dev/null)" = jottery-server ]; then
                kill -KILL "${process#/proc/}"
              fi
            done'
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' jottery-check)" = false && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' jottery-check)" = false

      # Earlier images ran as root, so every existing volume is owned by root
      - name: Check a volume from an earlier image still works
        run: |
          docker volume create jottery-upgrade
          docker run --rm --user root --entrypoint /bin/sh --volume jottery-upgrade:/app/data jottery:check \
            -c 'touch /app/data/jottery.db && chown -R root:root /app/data'
          docker run --detach --name jottery-upgrade --publish 8089:8088 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --volume jottery-upgrade:/app/data jottery:check
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:8089/health && break
            sleep 2
          done
          curl --fail --silent --show-error --output /dev/null http://localhost:8089/health
          test "$(docker exec jottery-upgrade stat --format '%u' /app/data/jottery.db)" = 10001

      - name: Show container logs
        if: failure()
        run: |
          docker logs jottery-check || true
          docker logs jottery-upgrade || true
