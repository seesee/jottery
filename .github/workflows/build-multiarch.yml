name: Build Full Multi-Arch Jottery

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SQLX_OFFLINE: "true"

jobs:
  linux-tui:
    name: Build Linux TUI Binaries
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      VERSION: ${{ github.ref_name }}
  
    container:
      image: debian:bullseye-slim
  
    steps:
      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl \
            build-essential \
            pkg-config \
            libssl-dev \
            sqlcipher \
            libsqlcipher-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            qemu-user-static \
            ca-certificates
          update-ca-certificates
  
      - uses: actions/checkout@v4
  
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
  
      - name: Install Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf
  
      - uses: Swatinem/rust-cache@v2
  
      - name: Configure cross toolchains for ring/openssl
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
  
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          echo "AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
  
      - name: Build Linux TUI (all arches)
        run: |
          chmod +x ./jottery-tui-build.sh
          ./jottery-tui-build.sh
          mkdir -p releases-versioned
          for f in releases/*; do
            base=$(basename "$f")
            cp "$f" "releases-versioned/${base}-${VERSION}"
          done
  
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tui
          path: releases-versioned/*

  macos-tui:
    name: Build macOS TUI
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install SQLCipher
        run: brew install sqlcipher

      - name: Build macOS TUI
        run: |
          cd tui
          cargo build --release --features sqlcipher
          mkdir -p ../releases-versioned
          cp target/release/jottery ../releases-versioned/jottery-macos-${VERSION}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-tui
          path: releases-versioned/*

  windows-tui:
    name: Build Windows TUI
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows TUI
        shell: bash
        run: |
          cd tui
          cargo build --release --no-default-features --features sqlite
          mkdir -p ../releases-versioned
          cp target/release/jottery.exe ../releases-versioned/jottery-windows-${VERSION}.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-tui
          path: releases-versioned/*

  collect-tui:
    name: Collect All TUI Binaries
    needs: [linux-tui, macos-tui, windows-tui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Combine versioned TUI files
        run: |
          rm -rf releases
          mkdir releases
          cp collected/linux-tui/* releases/
          cp collected/macos-tui/* releases/
          cp collected/windows-tui/* releases/

      - name: Create ZIP bundle
        run: |
          zip -r jottery-tui-${VERSION}.zip releases
          mkdir release-assets
          mv jottery-tui-${VERSION}.zip release-assets/

      - name: Upload ZIP bundle for Release
        uses: actions/upload-artifact@v4
        with:
          name: tui-release-zip
          path: release-assets/*

      - name: Upload combined TUI folder
        uses: actions/upload-artifact@v4
        with:
          name: all-tui
          path: releases/*

  docker-build:
    name: Build Multi-Arch Docker Image
    needs: collect-tui
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SQLX_OFFLINE: "true"
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare releases directory
        run: mkdir -p releases

      - name: Download TUI bundle
        uses: actions/download-artifact@v4
        with:
          name: all-tui
          path: releases

      - name: Debug workspace
        run: ls -R releases

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:buildcache,mode=max
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:${{ github.ref_name }}

  make-release:
    name: Publish GitHub Release
    needs: [collect-tui, docker-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release ZIP and TUI files
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jottery ${{ github.ref_name }}
          files: |
            release-assets/tui-release-zip/*
            release-assets/all-tui/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
