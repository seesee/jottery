name: Build Full Multi-Arch Jottery

on:
  push:
    tags:
      - "v*"
  # Manual runs build the binaries only; the Docker image and GitHub release
  # jobs are gated on a tag ref below
  workflow_dispatch:

# Read-only by default. Every job here runs third-party build code (npm packages,
# crate build scripts, proc macros), and only make-release needs to write.
permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  linux-tui:
    name: Build Linux TUI Binaries
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    # Built with cargo-zigbuild rather than inside an old Debian container. Zig
    # ships its own C toolchain and glibc stubs, so the binaries can target
    # glibc 2.31 (Debian 11 / Ubuntu 20.04 era) from any runner, and the job no
    # longer depends on a distribution's package archive staying online.
    # The Linux TUI uses bundled SQLite and rustls, so no C libraries are needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf

      # Pinned by hash rather than through setup-zig, which has no Node 24 release,
      # and which would be one more third-party action in a release build.
      - name: Install Zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/zig.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/zig"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: pipx install cargo-zigbuild==0.23.4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tui

      - name: Build Linux TUI (all arches)
        run: |
          chmod +x ./jottery-tui-build.sh
          ./jottery-tui-build.sh
          mkdir -p releases-versioned
          for f in releases/*; do
            base=$(basename "$f")
            cp "$f" "releases-versioned/${base}-${VERSION}"
          done

      - name: Smoke test x64 binary
        run: |
          ./releases/jottery-linux-x64 --version
          echo "glibc symbol versions required:"
          strings ./releases/jottery-linux-x64 | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tui
          path: releases-versioned/*

  macos-tui:
    name: Build macOS TUI
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install SQLCipher
        run: brew install sqlcipher

      - name: Build macOS TUI
        run: |
          cd tui
          cargo build --release --features sqlcipher
          mkdir -p ../releases-versioned
          cp target/release/jottery ../releases-versioned/jottery-macos-${VERSION}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tui
          path: releases-versioned/*

  windows-tui:
    name: Build Windows TUI
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build Windows TUI
        shell: bash
        run: |
          cd tui
          cargo build --release --no-default-features --features sqlite
          mkdir -p ../releases-versioned
          cp target/release/jottery.exe ../releases-versioned/jottery-windows-${VERSION}.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tui
          path: releases-versioned/*

  web-app:
    name: Build Web App (Offline Bundle)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      # Lifecycle scripts stay off: nothing here needs them, and a compromised
      # package could otherwise alter dist before it's zipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Create offline ZIP bundle
        run: |
          cd dist
          zip -r ../jottery-web-${VERSION}-offline.zip \
            index.html \
            favicon.ico \
            favicon.svg \
            favicon-16x16.png \
            favicon-32x32.png \
            apple-touch-icon.png \
            android-chrome-192x192.png \
            android-chrome-512x512.png \
            site.webmanifest \
            pdf.worker.min.mjs \
            version.json \
            screenshots/ \
            -x "*.DS_Store"
          cd ..
          mkdir -p web-release
          mv jottery-web-${VERSION}-offline.zip web-release/

      - name: Upload web app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: web-release/*

  collect-tui:
    name: Collect All TUI Binaries
    needs: [linux-tui, macos-tui, windows-tui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: collected

      - name: Combine versioned TUI files
        run: |
          rm -rf releases
          mkdir releases
          cp collected/linux-tui/* releases/
          cp collected/macos-tui/* releases/
          cp collected/windows-tui/* releases/

      - name: Create ZIP bundle
        run: |
          zip -r jottery-tui-${VERSION}.zip releases
          mkdir release-assets
          mv jottery-tui-${VERSION}.zip release-assets/

      - name: Upload ZIP bundle for Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-release-zip
          path: release-assets/*

      - name: Upload combined TUI folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-tui
          path: releases/*

  docker-build:
    name: Build Multi-Arch Docker Image
    needs: collect-tui
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SQLX_OFFLINE: "true"
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare releases directory
        run: mkdir -p releases

      - name: Download TUI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-tui
          path: releases

      - name: Debug workspace
        run: ls -R releases

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:buildcache,mode=max
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:${{ github.ref_name }}

  make-release:
    name: Publish GitHub Release
    needs: [collect-tui, docker-build, web-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release ZIP and TUI files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Create non-versioned copies for /latest/ downloads
        run: |
          # TUI binaries
          cd release-assets/all-tui
          for f in *-${VERSION}*; do
            # Create non-versioned copy by removing version suffix
            base=$(echo "$f" | sed "s/-${VERSION}//")
            cp "$f" "$base"
          done
          ls -la

          # Web app
          cd ../web-app
          for f in *-${VERSION}*; do
            # Create non-versioned copy (jottery-web-v1.0.0-offline.zip -> jottery-web.zip)
            base=$(echo "$f" | sed "s/-${VERSION}-offline//")
            cp "$f" "$base"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Jottery ${{ github.ref_name }}
          files: |
            release-assets/tui-release-zip/*
            release-assets/all-tui/*
            release-assets/web-app/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
