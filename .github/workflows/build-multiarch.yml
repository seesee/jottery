name: Build Full Multi-Arch Jottery

on:
  push:
    tags:
      - "v*"

jobs:
  linux-tui:
    name: Build Linux TUI Binaries
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y sqlcipher libsqlcipher-dev

      - name: Build Linux TUI (all arches)
        run: |
          chmod +x ./jottery-tui-build.sh
          ./jottery-tui-build.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tui
          path: releases/*


  macos-tui:
    name: Build macOS TUI
    runs-on: macos-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLCipher
        run: brew install sqlcipher

      - name: Build macOS TUI
        run: |
          cd tui
          cargo build --release
          mkdir -p ../releases
          cp target/release/jottery ../releases/jottery-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-tui
          path: releases/*


  windows-tui:
    name: Build Windows TUI
    runs-on: windows-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLCipher
        run: choco install sqlcipher

      - name: Build Windows TUI
        shell: bash
        run: |
          cd tui
          cargo build --release
          mkdir -p ../releases
          cp target/release/jottery.exe ../releases/jottery-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-tui
          path: releases/*


  collect-tui:
    name: Collect All TUI Binaries
    needs: [linux-tui, macos-tui, windows-tui]
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Assemble releases folder
        run: |
          rm -rf releases
          mkdir releases
          cp collected/linux-tui/* releases/ || true
          cp collected/macos-tui/* releases/ || true
          cp collected/windows-tui/* releases/ || true

      - name: Upload combined TUI folder
        uses: actions/upload-artifact@v4
        with:
          name: all-tui
          path: releases/*


  docker-build:
    name: Build Multi-Arch Docker Image
    needs: collect-tui
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Download TUI bundle
        uses: actions/download-artifact@v4
        with:
          name: all-tui
          path: releases

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/jottery:${{ github.ref_name }}
