  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --code-bg: #f2f2f7;
    --code-fg: #1c1c1e;
    --link: #007aff;
    --hr: #d1d1d6;
    --bq-border: #c7c7cc;
    --bq-bg: #f9f9f9;
    --table-border: #d1d1d6;
    --table-stripe: #f8f8f8;
  }
  .dark {
    --bg: #1c1c1e;
    --fg: #e5e5e7;
    --code-bg: #2c2c2e;
    --code-fg: #e5e5e7;
    --link: #64d2ff;
    --hr: #48484a;
    --bq-border: #636366;
    --bq-bg: #2c2c2e;
    --table-border: #48484a;
    --table-stripe: #2c2c2e;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--fg);
    background-color: var(--bg);
    padding: 16px;
    margin: 0;
    word-wrap: break-word;
    overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, h4, h5, h6 {
    margin-top: 1.2em;
    margin-bottom: 0.4em;
    font-weight: 600;
    line-height: 1.3;
  }
  h1 { font-size: 1.8em; border-bottom: 1px solid var(--hr); padding-bottom: 0.3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--hr); padding-bottom: 0.3em; }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1.1em; }
  h5 { font-size: 1em; }
  h6 { font-size: 0.9em; opacity: 0.8; }
  p { margin: 0.6em 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 0.15em 0.35em;
    border-radius: 4px;
  }
  pre {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 12px 16px;
    border-radius: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0.8em 0;
    line-height: 1.45;
  }
  pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    font-size: 0.85em;
  }
  blockquote {
    margin: 0.8em 0;
    padding: 0.4em 1em;
    border-left: 4px solid var(--bq-border);
    background: var(--bq-bg);
    border-radius: 0 4px 4px 0;
  }
  blockquote p { margin: 0.3em 0; }
  ul, ol { padding-left: 1.5em; margin: 0.6em 0; }
  li { margin: 0.2em 0; }
  li > ul, li > ol { margin: 0.1em 0; }
  hr {
    border: none;
    border-top: 1px solid var(--hr);
    margin: 1.5em 0;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8em 0;
    font-size: 0.95em;
  }
  th, td {
    border: 1px solid var(--table-border);
    padding: 8px 12px;
    text-align: left;
  }
  th {
    font-weight: 600;
    background: var(--code-bg);
  }
  tr:nth-child(even) { background: var(--table-stripe); }
  img { max-width: 100%; height: auto; border-radius: 4px; }
  del { opacity: 0.6; }
  input[type="checkbox"] { margin-right: 0.4em; }
  .attachment-link {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    background: var(--code-bg);
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--link);
    cursor: pointer;
  }
  .attachment-link::before { content: '📎 '; }
  .note-link {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    background: var(--code-bg);
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--link);
  }
  .note-link::before { content: '📄 '; }

  /* Override highlight.js background to match our theme */
  .hljs { background: transparent !important; }

  /* Dark mode highlight.js overrides (github-dark palette) */
  .dark .hljs { color: #e6edf3; }
  .dark .hljs-keyword,
  .dark .hljs-selector-tag { color: #ff7b72; }
  .dark .hljs-string,
  .dark .hljs-addition { color: #a5d6ff; }
  .dark .hljs-comment,
  .dark .hljs-quote { color: #8b949e; }
  .dark .hljs-number,
  .dark .hljs-literal { color: #79c0ff; }
  .dark .hljs-title,
  .dark .hljs-section,
  .dark .hljs-title.function_ { color: #d2a8ff; }
  .dark .hljs-type,
  .dark .hljs-built_in { color: #ffa657; }
  .dark .hljs-variable,
  .dark .hljs-template-variable { color: #ffa657; }
  .dark .hljs-attr,
  .dark .hljs-attribute { color: #79c0ff; }
  .dark .hljs-symbol,
  .dark .hljs-bullet { color: #ffa657; }
  .dark .hljs-deletion { color: #ffa198; background: #490202; }
  .dark .hljs-addition { background: #04260f; }
  .dark .hljs-emphasis { font-style: italic; }
  .dark .hljs-strong { font-weight: bold; }
