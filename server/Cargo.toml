[package]
name = "jottery-server"
version = "1.0.3"
edition = "2021"

[lib]
name = "jottery_server"
path = "src/lib.rs"

[[bin]]
name = "jottery-server"
path = "src/main.rs"

[[bin]]
name = "jottery-admin"
path = "src/admin.rs"

[[bin]]
name = "gen_password_hash"
path = "src/bin/gen_password_hash.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs", "set-header"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "sqlite", "migrate", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.21"
argon2 = "0.5"

# CLI
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"

# Rate limiting
tower_governor = "0.4"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Validation
email_address = "0.2"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
http-body-util = "0.1"
