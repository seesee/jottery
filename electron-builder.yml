appId: io.jottery.app
productName: Jottery
copyright: Copyright © 2025 Jottery Contributors

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - electron/dist/**/*
  - package.json
  - "!src"
  - "!server"
  - "!tui"
  - "!scripts"
  - "!**/*.map"
  - "!**/*.md"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"

asar: true
compression: maximum

# macOS configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  icon: dist/android-chrome-512x512.png

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: dist/favicon.ico
  publisherName: Jottery

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Office
  icon: dist/android-chrome-512x512.png
  synopsis: Privacy-focused encrypted notes
  description: A privacy-focused, self-hosted scratch pad application for capturing, organising, and searching notes with rich content, syntax highlighting, and encryption.

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3

# Auto-updater configuration
publish:
  provider: github
  owner: seesee
  repo: jottery
  releaseType: release

# Extra resources (copied to app resources directory)
extraResources:
  - from: build/
    to: .
    filter:
      - "!*.plist"
