<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-top: #1b1626;
    --bg-bottom: #131318;
    --accent: #8b5cf6;
    --text: #f2f0f7;
    --bezel: #26262f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .headline {
    color: var(--text);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.15;
    margin: 7vh 6vw 4vh;
    font-size: 5.2vw;
  }
  .headline .accent { color: var(--accent); }
  .shell {
    /* Height fills the remaining flex space below the headline; width is
       derived from the raw screenshot's aspect ratio so the image fills the
       frame exactly with no gap and no crop. content-box keeps the aspect
       ratio applied to the image area itself, not the bezel border. */
    box-sizing: content-box;
    flex: 1; width: auto; aspect-ratio: 1320 / 2868;
    max-width: 92vw;
    border: 0.9vw solid var(--bezel);
    border-bottom: none;
    border-radius: 5.5vw 5.5vw 0 0;
    overflow: hidden;
    box-shadow: 0 -1vh 8vh rgba(139, 92, 246, 0.25);
    background: #000;
  }
  .shell img { width: 100%; display: block; }
  body.ipad .headline { font-size: 4vw; margin-top: 5vh; }
  body.ipad .shell { aspect-ratio: 2064 / 2752; border-radius: 3vw 3vw 0 0; border-width: 0.6vw; }
</style>
</head>
<body>
  <h1 class="headline" id="headline"></h1>
  <div class="shell"><img id="shot" alt=""></div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('headline').textContent = params.get('headline') || '';
    document.getElementById('shot').src = params.get('img') || '';
    if (params.get('device') === 'ipad-13') document.body.classList.add('ipad');
  </script>
</body>
</html>
