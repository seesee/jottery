[package]
name = "jottery-tui"
version = "1.3.1"
edition = "2021"
authors = ["Jottery Contributors"]
description = "Terminal User Interface for Jottery - A privacy-focused note-taking app"
license = "MIT"

[[bin]]
name = "jottery"
path = "src/main.rs"

[[bin]]
name = "find-untranslated"
path = "scripts/find-untranslated.rs"

[features]
default = ["sqlite", "keychain"]
sqlite = ["rusqlite/bundled"]              # normal SQLite
sqlcipher = ["rusqlite/sqlcipher", "native-tls", "openssl", "openssl-sys"]
# SQLCipher and OpenSSL compiled in, for release binaries that have to run on a
# machine without Homebrew. Plain `sqlcipher` links the system library instead.
sqlcipher-vendored = ["sqlcipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]
keychain = ["keyring"]                     # OS keychain for secure password storage

[dependencies]
# TUI Framework
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"

# Database
rusqlite = { version = "0.32.1", features = [] }

native-tls = { version = "0.2", optional = true }
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }

# HTTP client for sync
# Both root sets: the bundled ones for a machine with none of its own, and the system's,
# so a CA the user has installed works, as does SSL_CERT_FILE.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "blocking"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Cryptography
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.23"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# URL encoding
urlencoding = "2.1"

# Regex for search parsing
regex = "1.10"
unicode-normalization = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Password input
rpassword = "7.5"

# Config management
dirs = "5.0"

# OS keychain for secure password storage (optional)
# Without a store chosen here, keyring uses a mock that forgets everything at exit. The
# Secret Service one is the pure Rust kind, so builds don't need libdbus.
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Hostname detection
hostname = "0.4"

# Temporary files for external editor
tempfile = "3.13"


# Syntax highlighting
syntect = "5.3"

# Markdown parsing
pulldown-cmark = "0.12"

# Math expression evaluation (for calc mode)
evalexpr = "13.1"

# Internationalization
rust-i18n = "3"

# Unicode width calculation (for proper emoji/CJK character handling)
unicode-width = "0.2"

# YAML parsing (for translation scripts)
serde_yaml = "0.9"
# Splitting $EDITOR and $PAGER into a program and its arguments
shell-words = "1"
# Compression for backups, which the web app writes with zlib
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# Clearing decrypted temporary files when the process is told to stop
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
